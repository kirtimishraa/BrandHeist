<!DOCTYPE html>
<html lang="en">

<head>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XK27KGN0RG"></script>

  <meta charset="utf-8">

  <title>Got it - BrandHeist</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Thank you for reaching out to BrandHeist. We'll be in touch shortly.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">

  <!-- Vendor -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Site CSS -->
  <link href="assets/css/main.css" rel="stylesheet">
  <link href="assets/css/ui-improvements.css" rel="stylesheet">

  <link href="assets/img/brandheist-logo.svg" rel="icon" type="image/svg+xml">
  <link href="assets/img/favicon.png" rel="icon" sizes="any">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <style>
    /* ── Thank-you page layout ─────────────────────────────── */
    .ty-section {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 110px 0 90px;
    }

    .ty-section > .ty-bg {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ty-section::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        linear-gradient(180deg,
          rgba(8,8,6,0.82) 0%,
          rgba(8,8,6,0.60) 45%,
          rgba(8,8,6,0.82) 100%);
    }

    .ty-section > .container {
      position: relative;
      z-index: 3;
    }


    /* ── Animated SVG checkmark ────────────────────────────── */
    .ty-check-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
      animation: ty-pop 0.5s cubic-bezier(0.22, 0.91, 0.36, 1) 0.15s both;
    }

    .ty-checkmark {
      width: 96px;
      height: 96px;
      fill: none;
      overflow: visible;
      filter: drop-shadow(0 0 22px rgba(244, 182, 61, 0.32));
    }

    /* Outer ring */
    .ty-circle-bg {
      stroke: rgba(244, 182, 61, 0.15);
      stroke-width: 2;
    }

    .ty-circle-draw {
      stroke: var(--accent-color);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 264;
      stroke-dashoffset: 264;
      animation: ty-draw-circle 0.75s ease-out 0.3s forwards;
    }

    /* Checkmark path */
    .ty-check-path {
      stroke: var(--accent-color);
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: ty-draw-check 0.45s ease-out 1.0s forwards;
    }

    @keyframes ty-draw-circle {
      to { stroke-dashoffset: 0; }
    }

    @keyframes ty-draw-check {
      to { stroke-dashoffset: 0; }
    }

    @keyframes ty-pop {
      from { transform: scale(0.6); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }


    /* ── Content ───────────────────────────────────────────── */
    .ty-tag {
      display: inline-block;
      margin-bottom: 22px;
      padding: 6px 16px;
      color: var(--contrast-color);
      background: var(--accent-color);
      border-radius: 100px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      animation: ty-rise 0.5s ease-out 1.0s both;
    }

    .ty-heading {
      margin: 0 0 18px;
      color: var(--heading-color);
      font-family: var(--heading-font);
      font-size: 54px;
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.5px;
      animation: ty-rise 0.5s ease-out 1.1s both;
    }

    .ty-body {
      max-width: 490px;
      margin: 0 auto 40px;
      color: rgba(255, 250, 238, 0.74);
      font-size: 17px;
      line-height: 1.75;
      animation: ty-rise 0.5s ease-out 1.2s both;
    }


    /* ── What happens next steps ───────────────────────────── */
    .ty-steps {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 440px;
      margin: 0 auto 44px;
      text-align: left;
      animation: ty-rise 0.5s ease-out 1.3s both;
    }

    .ty-step {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 18px;
      background: rgba(255, 250, 238, 0.055);
      border: 1px solid rgba(255, 250, 238, 0.10);
      border-radius: 12px;
      transition: border-color 0.25s ease, background-color 0.25s ease;
    }

    .ty-step:hover {
      background: rgba(255, 250, 238, 0.08);
      border-color: rgba(244, 182, 61, 0.28);
    }

    .ty-step-num {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-color);
      color: var(--contrast-color);
      border-radius: 50%;
      font-size: 12px;
      font-weight: 900;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .ty-step-text {
      color: rgba(255, 250, 238, 0.80);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.55;
      padding-top: 4px;
    }


    /* ── CTA row ───────────────────────────────────────────── */
    .ty-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      animation: ty-rise 0.5s ease-out 1.4s both;
    }

    .ty-actions .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 900;
      border: 1px solid rgba(255, 250, 238, 0.18);
      letter-spacing: 0.01em;
    }

    .ty-actions .cta-btn.back {
      color: var(--heading-color);
      background: rgba(255, 250, 238, 0.08);
      backdrop-filter: blur(12px);
    }

    .ty-actions .cta-btn.back:hover {
      background: rgba(255, 250, 238, 0.14);
      border-color: rgba(255, 250, 238, 0.35);
      transform: translateY(-2px);
    }

    .ty-actions .cta-btn.wa {
      color: #fff;
      background: #25d366;
      border-color: #25d366;
      box-shadow: 0 4px 18px rgba(37, 211, 102, 0.30);
    }

    .ty-actions .cta-btn.wa:hover {
      color: #fff;
      background: color-mix(in srgb, #25d366, white 14%);
      box-shadow: 0 6px 26px rgba(37, 211, 102, 0.50);
      transform: translateY(-2px);
    }


    /* ── Divider dot ───────────────────────────────────────── */
    .ty-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 36px auto 32px;
      max-width: 300px;
      animation: ty-rise 0.5s ease-out 1.25s both;
    }

    .ty-divider::before,
    .ty-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 250, 238, 0.12);
    }

    .ty-divider span {
      color: rgba(255, 250, 238, 0.40);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }


    /* ── Fixed footer bar ──────────────────────────────────── */
    .ty-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 12px 20px;
      text-align: center;
      background: rgba(8, 8, 6, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 250, 238, 0.08);
      font-size: 13px;
      color: rgba(255, 250, 238, 0.50);
    }

    .ty-footer .sitename {
      color: rgba(255, 250, 238, 0.78);
      font-weight: 800;
    }

    .ty-footer a {
      color: rgba(255, 250, 238, 0.50);
    }

    .ty-footer a:hover {
      color: var(--accent-color);
    }


    /* ── Keyframes ─────────────────────────────────────────── */
    @keyframes ty-rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0);    }
    }


    /* ── Responsive ────────────────────────────────────────── */
    @media (max-width: 767px) {
      .ty-heading { font-size: 36px; }
      .ty-body    { font-size: 15px; }
      .ty-section { padding: 100px 0 80px; }

      .ty-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .ty-actions .cta-btn {
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .ty-heading { font-size: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ty-check-wrap,
      .ty-tag, .ty-heading, .ty-body,
      .ty-steps, .ty-divider, .ty-actions {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .ty-circle-draw  { animation: none; stroke-dashoffset: 0; }
      .ty-check-path   { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>

<body>

  <!-- ── Header (logo-only, no nav) ───────────────────────────── -->
  <header id="header" class="header fixed-top">
    <div class="branding d-flex align-items-center">
      <div class="container position-relative d-flex align-items-center justify-content-between">
        <a href="index.html" class="logo d-flex align-items-center" aria-label="BrandHeist - Go home">
          <img src="assets/img/brandheist-logo.svg" alt="BrandHeist logo" width="44" height="44" decoding="async">
          <span class="sitename">BrandHeist</span>
        </a>
        <a class="btn-get-free-audit d-none d-xl-inline-flex" href="index.html#get-free-audit">
          Free Website Audit <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- ── Main success section ─────────────────────────────────── -->
  <main>
    <section class="ty-section dark-background">

      <!-- Background image (reuse hero bg) -->
      <img class="ty-bg"
           src="assets/img/hero-bg.webp"
           alt=""
           aria-hidden="true"
           decoding="async"
           fetchpriority="high">

      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-md-10 text-center">

            <!-- Animated SVG checkmark -->
            <div class="ty-check-wrap">
              <svg class="ty-checkmark"
                   viewBox="0 0 88 88"
                   xmlns="http://www.w3.org/2000/svg"
                   role="img"
                   aria-label="Success">
                <!-- Static background ring -->
                <circle class="ty-circle-bg" cx="44" cy="44" r="42"/>
                <!-- Animated drawing ring -->
                <circle class="ty-circle-draw" cx="44" cy="44" r="42"
                        transform="rotate(-90 44 44)"/>
                <!-- Animated checkmark path -->
                <polyline class="ty-check-path" points="22,44 36,57 66,31"/>
              </svg>
            </div>

            <!-- Tag pill (JS fills) -->
            <span class="ty-tag" id="ty-tag">Sent</span>

            <!-- Heading (JS fills) -->
            <h1 class="ty-heading" id="ty-heading">&nbsp;</h1>

            <!-- Body copy (JS fills) -->
            <p class="ty-body" id="ty-body"></p>

            <!-- What happens next (JS fills - hidden for newsletter) -->
            <div class="ty-divider" id="ty-divider" style="display:none">
              <span>What happens next</span>
            </div>
            <div class="ty-steps" id="ty-steps" style="display:none"></div>

            <!-- CTAs -->
            <div class="ty-actions">
              <a href="index.html" class="cta-btn back">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
                Back to Home
              </a>
              <a href="https://wa.me/919137920469"
                 id="ty-wa"
                 class="cta-btn wa"
                 target="_blank"
                 rel="noopener noreferrer"
                 aria-label="Chat with BrandHeist on WhatsApp">
                <i class="bi bi-whatsapp" aria-hidden="true"></i>
                Chat on WhatsApp
              </a>
            </div>

          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ── Fixed footer bar ─────────────────────────────────────── -->
  <footer class="ty-footer">
    <p class="m-0">
      &copy; <span class="sitename">BrandHeist</span>
      &bull; <a href="index.html">Home</a>
      &bull; <a href="index.html#menu">Services</a>
      &bull; <a href="index.html#talk">Contact</a>
    </p>
  </footer>


  <!-- ── Detection + content injection ───────────────────────── -->
  <script>
    (function () {
      var params   = new URLSearchParams(window.location.search);
      var formKey  = params.get('form') || 'contact';

      var config = {
        audit: {
          tag  : 'Audit Requested',
          title: 'Your audit is in the queue.',
          body : 'We\'ll dig into your site and come back with real, actionable findings - usually within 24 hours.',
          steps: [
            'We audit your site for SEO, speed, and conversion gaps',
            'We put together a clear, tailored findings report',
            'We reach out to walk you through every finding'
          ],
          waMsg: 'Hi BrandHeist! I just requested a free audit. Looking forward to the results!'
        },
        contact: {
          tag  : 'Message Received',
          title: 'Message received.',
          body : 'Someone from the crew will get back to you shortly. We\'re usually pretty quick about it.',
          steps: [
            'We read your message carefully',
            'We match you with the right crew member',
            'You hear back within a few business hours'
          ],
          waMsg: "Hi BrandHeist! I just sent a message through the website. Let's connect!"
        },
        newsletter: {
          tag  : 'Newsletter Subscribed',
          title: 'You\'re on the list.',
          body : 'Expect sharp marketing insights, zero fluff. We publish when we actually have something worth saying.',
          steps: null,
          waMsg: 'Hi BrandHeist! Just subscribed to the newsletter. Really excited to see the content!'
        }
      };

      var d = config[formKey] || config.contact;

      // Inject content
      document.getElementById('ty-tag').textContent     = d.tag;
      document.getElementById('ty-heading').textContent = d.title;
      document.getElementById('ty-body').textContent    = d.body;

      // WhatsApp pre-filled message
      var waEl = document.getElementById('ty-wa');
      if (waEl) {
        waEl.href = 'https://wa.me/919137920469?text=' + encodeURIComponent(d.waMsg);
      }

      // What happens next steps
      if (d.steps) {
        document.getElementById('ty-divider').style.display = '';
        var stepsEl  = document.getElementById('ty-steps');
        stepsEl.style.display = '';
        stepsEl.innerHTML = d.steps.map(function (step, i) {
          return '<div class="ty-step">' +
            '<span class="ty-step-num">' + (i + 1) + '</span>' +
            '<span class="ty-step-text">' + step + '</span>' +
            '</div>';
        }).join('');
      }

      // Fire GA4 conversion event
      if (typeof gtag !== 'undefined') {
        gtag('event', 'form_submission_complete', {
          form_type : formKey,
          page_title: document.title
        });
      }
    })();
  </script>

</body>
</html>
